name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        id: run_tests
        continue-on-error: true
        run: |
          pytest --junitxml=report.xml || echo "test_status=failed" >> $GITHUB_OUTPUT

      - name: Send Report to Local Receiver via Tunnel
        if: always()
        run: |
          # Sends summary data to your ngrok tunnel secret endpoint
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "status": "${{ steps.run_tests.outcome }}"
          }' "${{ secrets.SECRET_WEBHOOK_URL }}" || true

      - name: Fail pipeline if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1